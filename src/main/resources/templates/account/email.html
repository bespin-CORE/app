<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'email')}">
<body>
<div class="vc-card">
 <h1 th:text="#{email.title}"></h1>
 <p th:if="${after == 'booking'}" th:text="#{email.bookingDone}"></p>
 <p th:text="#{email.verified}"></p><p th:text="${emailState.verified}"></p>
 <p th:text="#{email.pending}"></p><p th:text="${emailState.pending}"></p>
 <form th:action="@{/my/email}" method="post">
  <input type="hidden" name="after" th:value="${after}" />
  <label for="email" th:text="#{email.label}"></label><input id="email" name="email" type="email" maxlength="254" required />
  <button class="vc-btn-primary" type="submit" th:text="#{email.send}"></button>
 </form>
 <form th:if="${emailState.pending != null}" th:action="@{/my/email/resend}" method="post"><button type="submit" th:text="#{email.resend}"></button></form>
 <a th:if="${after == 'booking'}" th:href="@{/reservations}" th:text="#{email.later}"></a>
</div>
</body>
</html>
