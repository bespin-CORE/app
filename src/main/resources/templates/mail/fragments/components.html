<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<body>
<th:block th:fragment="reservationDetails(emphasizeCancelled)">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background-color:#f8f9fc;border:1px solid #e2e6f3;border-radius:8px;border-collapse:separate;">
<tr>
<td style="padding:12px 16px;width:34%;font-size:13px;line-height:1.5;font-weight:600;color:#3d4947;border-bottom:1px solid #e2e6f3;vertical-align:top;" th:text="#{mail.reservation.field.hospital}"></td>
<td style="padding:12px 16px;font-size:14px;line-height:1.5;font-weight:600;color:#131b2e;border-bottom:1px solid #e2e6f3;vertical-align:top;" th:text="${hospital}"></td>
</tr>
<tr>
<td style="padding:12px 16px;width:34%;font-size:13px;line-height:1.5;font-weight:600;color:#3d4947;border-bottom:1px solid #e2e6f3;vertical-align:top;" th:text="#{mail.reservation.field.treatment}"></td>
<td style="padding:12px 16px;font-size:14px;line-height:1.5;color:#131b2e;border-bottom:1px solid #e2e6f3;vertical-align:top;" th:text="${treatment}"></td>
</tr>
<tr>
<td style="padding:12px 16px;width:34%;font-size:13px;line-height:1.5;font-weight:600;color:#3d4947;border-bottom:1px solid #e2e6f3;vertical-align:top;" th:text="#{mail.reservation.field.schedule}"></td>
<td style="padding:12px 16px;font-size:14px;line-height:1.5;font-weight:600;color:#131b2e;border-bottom:1px solid #e2e6f3;vertical-align:top;" th:text="|${date} ${time}|"></td>
</tr>
<tr>
<td style="padding:12px 16px;width:34%;font-size:13px;line-height:1.5;font-weight:600;color:#3d4947;border-bottom:1px solid #e2e6f3;vertical-align:top;" th:text="#{mail.reservation.field.pet}"></td>
<td style="padding:12px 16px;font-size:14px;line-height:1.5;color:#131b2e;border-bottom:1px solid #e2e6f3;vertical-align:top;" th:text="${petName}"></td>
</tr>
<tr>
<td style="padding:12px 16px;width:34%;font-size:13px;line-height:1.5;font-weight:600;color:#3d4947;vertical-align:middle;" th:text="#{mail.reservation.field.status}"></td>
<td style="padding:12px 16px;font-size:14px;line-height:1.5;vertical-align:middle;">
<span th:if="${emphasizeCancelled}" style="display:inline-block;padding:4px 10px;background-color:#fdf2f2;border:1px solid #f2c6c6;border-radius:999px;font-size:13px;font-weight:700;color:#8c2d2d;" th:text="#{${'reservationStatus.' + status}}"></span>
<span th:unless="${emphasizeCancelled}" style="display:inline-block;padding:4px 10px;background-color:#e6f4f1;border:1px solid #b8dfd7;border-radius:999px;font-size:13px;font-weight:700;color:#00685f;" th:text="#{${'reservationStatus.' + status}}"></span>
</td>
</tr>
</table>
</th:block>

<th:block th:fragment="reminderContent">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;margin:0 0 16px 0;background-color:#e6f4f1;border-left:4px solid #00685f;border-radius:6px;">
<tr>
<td style="padding:14px 16px;">
<p style="margin:0 0 4px 0;font-size:12px;line-height:1.4;font-weight:600;color:#3d4947;" th:text="#{mail.reservation.reminder.highlight}"></p>
<p style="margin:0;font-size:18px;line-height:1.4;font-weight:700;color:#00685f;" th:text="|${date} ${time}|"></p>
</td>
</tr>
</table>
<th:block th:replace="~{mail/fragments/components :: reservationDetails(false)}"></th:block>
</th:block>
</body>
</html>
