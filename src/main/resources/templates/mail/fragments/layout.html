<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="ko"
	th:fragment="page(title, intro, content, actionUrl, actionLabel, fallbackUrl, safetyNote)">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title th:text="${title}"></title>
</head>
<body style="margin:0;padding:0;background-color:#f2f3ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#131b2e;-webkit-text-size-adjust:100%;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background-color:#f2f3ff;margin:0;padding:0;">
<tr>
<td align="center" style="padding:36px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;margin:0 auto;">
<tr>
<td style="background-color:#ffffff;border:1px solid #e2e6f3;border-radius:12px;padding:40px 36px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
<tr>
<td style="padding:0 0 28px 0;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0">
<tr>
<td width="20" height="20" style="width:20px;height:20px;background-color:#00685f;border-radius:5px;font-size:0;line-height:0;"></td>
<td width="10" style="width:10px;font-size:0;line-height:0;"></td>
<td style="font-size:20px;line-height:20px;font-weight:700;color:#00685f;letter-spacing:-0.3px;" th:text="#{mail.brand}"></td>
</tr>
</table>
</td>
</tr>
<tr>
<td style="padding:0 0 14px 0;">
<h1 style="margin:0;font-size:24px;line-height:1.35;font-weight:700;color:#131b2e;letter-spacing:-0.3px;" th:text="${title}"></h1>
</td>
</tr>
<tr>
<td style="padding:0 0 24px 0;">
<p style="margin:0;font-size:15px;line-height:1.65;color:#131b2e;" th:text="${intro}"></p>
</td>
</tr>
<tr th:if="${content != null}">
<td style="padding:0 0 24px 0;">
<th:block th:replace="${content}"></th:block>
</td>
</tr>
<tr>
<td th:style="${fallbackUrl != null || safetyNote != null} ? 'padding:0 0 24px 0;' : 'padding:0;'">
<table role="presentation" cellpadding="0" cellspacing="0" border="0">
<tr>
<td align="center" style="background-color:#00685f;border-radius:8px;">
<a th:href="${actionUrl}" th:text="${actionLabel}" style="display:inline-block;padding:14px 28px;font-size:15px;line-height:1.2;font-weight:700;color:#ffffff;text-decoration:none;border-radius:8px;"></a>
</td>
</tr>
</table>
</td>
</tr>
<tr th:if="${fallbackUrl != null}">
<td style="padding:0 0 20px 0;">
<p style="margin:0 0 8px 0;font-size:13px;line-height:1.6;color:#3d4947;" th:text="#{mail.link.fallback}"></p>
<p style="margin:0;padding:10px 12px;background-color:#f8f9fc;border:1px solid #e2e6f3;border-radius:6px;font-size:12px;line-height:1.5;color:#00685f;word-break:break-all;" th:text="${fallbackUrl}"></p>
</td>
</tr>
<tr th:if="${safetyNote != null}">
<td style="padding:20px 0 0 0;border-top:1px solid #e2e6f3;">
<p style="margin:0;font-size:13px;line-height:1.6;color:#3d4947;" th:text="${safetyNote}"></p>
</td>
</tr>
</table>
</td>
</tr>
<tr>
<td align="center" style="padding:20px 16px 0 16px;">
<p style="margin:0;font-size:12px;line-height:1.6;color:#3d4947;text-align:center;" th:text="#{mail.footer}"></p>
</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
